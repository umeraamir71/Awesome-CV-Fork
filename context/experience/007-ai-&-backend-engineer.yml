  - name: "Event-Driven Meeting Service (Golang)"
    description: "A real-time, Redis-backed meeting backend with clean hexagonal boundaries, strong ordering where it matters, and horizontal scalability."
    tech: ["Golang", "Redis (Streams, Pub/Sub, Locks)", "WebSockets", "CQRS/Projections", "Uber Fx", "Zap", "Docker/Make"]
    impact:
      - "Stateless nodes behind a load balancer; shared state in Redis for scale and resilience."
      - "Cross-node locks, consumer groups, and idempotency keys for multi-instance safety."
      - "Dispatchers enforce ordering/commit for critical events; projection runner supports catch-up and continuous apply."
      - "WebSocket hub with sharded connection maps, selective broadcast, and playback-to-live resume via lastEventId."
      - "Lifecycle manager, per-meeting registries, and session grace with deterministic cleanup."
      - "Channel separation: Control (ordered/committed), AI (async/worker-committed), Realtime (high-frequency/ephemeral)."
      - "Operational maturity: graceful shutdown, bounded queues/backpressure, structured logging, config validation."
      - "Security and access: STS for transcription (JWT verification) and Redis-backed rate limiting policies."
      - "Integration points: enqueues AI jobs for Node.js workers; exposes APIs/WS used by React UI."

  - name: "Cross-Service Integration"
    description: "Integrated Golang meeting service, Node.js AI workers, and the React UI into a cohesive system."
    tech: ["Node.js", "React", "Golang", "Redis", "HTTP/WS", "Auth/JWT", "Env/Config"]
    impact:
