    description: "Ran a ~6-month POC on Photon/C# exploring creative LLM orchestration using OpenAI models (GPT-4/4.1, o1, o3, o3-mini). The validated design is being productized by backend as scalable Node.js AI workers."
    tech: ["Photon", "C#", "OpenAI (GPT-4, GPT-4.1, o1, o3, o3-mini)", "Manual Tool-Calling", "OpenAI Evals"]
